<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телеграм за номером</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2aabee; --ok:#16a34a; --bad:#dc2626; --border:#e5e7eb; --field:#f8fafc; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2e36; --field:#1f232a; }
  }
  :root[data-theme="dark"] { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2e36; --field:#1f232a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
  h1 { margin:0 0 4px; font-size:20px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input { width:100%; padding:12px 14px; font-size:18px; border:1px solid var(--border); border-radius:10px;
          background:transparent; color:var(--text); outline:none; }
  input.small { font-size:14px; padding:9px 12px; }
  input:focus { border-color:var(--accent); }
  button { display:inline-flex; align-items:center; justify-content:center; padding:8px 12px; border-radius:8px;
           border:1px solid var(--border); background:transparent; color:var(--text); font-size:13px; cursor:pointer; white-space:nowrap; }
  button.primary { width:100%; margin-top:14px; background:var(--accent); border-color:var(--accent); color:#fff; font-size:16px; padding:12px; border-radius:10px; }
  button:disabled { opacity:.6; cursor:default; }
  details { margin-top:4px; font-size:13px; color:var(--muted); }
  summary { cursor:pointer; }
  .err { color:var(--bad); font-size:14px; margin-top:8px; min-height:1em; }
  .result { margin-top:20px; display:none; }
  .result.show { display:block; }
  .status { font-size:15px; font-weight:600; margin-bottom:10px; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); }
  .field { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--field); border:1px solid var(--border);
           border-radius:10px; margin-top:8px; }
  .field .k { font-size:12px; color:var(--muted); min-width:72px; }
  .field .v { flex:1; min-width:0; font-family:ui-monospace, monospace; font-size:15px; overflow-wrap:anywhere; }
  .field a { color:var(--accent); text-decoration:none; }
  .hint { margin-top:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main class="card">
  <h1>Телеграм за номером телефону</h1>
  <p class="sub">Покаже нікнейм і Telegram ID, якщо номер зареєстрований.</p>

  <form id="form" autocomplete="off">
    <label for="phone">Номер телефону</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="+380 67 123 45 67" required>

    <details id="settings">
      <summary>Ключ доступу</summary>
      <input id="key" class="small" type="password" placeholder="TG_ACCESS_KEY">
    </details>

    <div class="err" id="err"></div>
    <button class="primary" id="go" type="submit">Знайти</button>
  </form>

  <section class="result" id="result">
    <div class="status" id="status"></div>
    <div id="fields"></div>
  </section>

  <p class="hint">Акаунт може не знайтися, якщо людина заборонила пошук за номером у налаштуваннях приватності Telegram.</p>
</main>

<script>
  // Бекенд: той самий сайт (/api/tg/check), або інший через ?api=https://your-app.vercel.app
  const API = (new URLSearchParams(location.search).get('api') || '').replace(/\/$/, '');
  const DEFAULT_CC = '380'; // код країни за замовчуванням (Україна)
  const $ = id => document.getElementById(id);

  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  $('key').value = new URLSearchParams(location.search).get('key') || store.get('tgKey');
  if (!$('key').value) $('settings').open = true;

  function normalize(raw) {
    let s = raw.trim().replace(/[\s()\-.]/g, '');
    if (s.startsWith('00')) s = '+' + s.slice(2);
    let d = s.replace(/\D/g, '');
    if (!s.startsWith('+')) {
      if (d.startsWith('0') && d.length === 10) d = DEFAULT_CC.slice(0, 2) + d; // 0671234567 -> 380671234567
      else if (d.length === 9) d = DEFAULT_CC + d;                               // 671234567  -> 380671234567
    }
    return d.length >= 8 && d.length <= 15 ? d : null;
  }

  function field(label, value, href) {
    const row = document.createElement('div'); row.className = 'field';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = label;
    const v = document.createElement('span'); v.className = 'v';
    if (href) { const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = value; v.append(a); }
    else v.textContent = value;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Копіювати';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(value); b.textContent = '✓'; } catch { b.textContent = '✗'; }
      setTimeout(() => b.textContent = 'Копіювати', 1200);
    };
    row.append(k, v, b);
    return row;
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').textContent = '';
    $('result').classList.remove('show');
    const phone = normalize($('phone').value);
    if (!phone) { $('err').textContent = 'Некоректний номер. Приклад: +380671234567'; return; }
    const key = $('key').value.trim();
    if (!key) { $('settings').open = true; $('err').textContent = 'Вкажіть ключ доступу'; return; }
    store.set('tgKey', key);

    $('go').disabled = true; $('go').textContent = 'Шукаю…';
    try {
      const r = await fetch(`${API}/api/tg/check?phone=${phone}`, { headers: { 'X-Access-Key': key } });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);

      const f = $('fields'); f.replaceChildren();
      if (data.exists) {
        $('status').textContent = 'Акаунт знайдено'; $('status').className = 'status ok';
        if (data.username) f.append(field('Нікнейм', '@' + data.username, 'https://t.me/' + data.username));
        else f.append(field('Нікнейм', 'немає'));
        f.append(field('ID', data.id));
        if (data.name) f.append(field('Ім’я', data.name));
      } else {
        $('status').textContent = 'Акаунт не знайдено'; $('status').className = 'status bad';
      }
      $('result').classList.add('show');
    } catch (err) {
      $('err').textContent = 'Помилка: ' + err.message;
    } finally {
      $('go').disabled = false; $('go').textContent = 'Знайти';
    }
  });
</script>
</body>
</html>
