<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телеграм за номером</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --accent:#2aabee; --ok:#16a34a; --bad:#dc2626; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2e36; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; }
  h1 { margin:0 0 4px; font-size:20px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:12px 14px; font-size:18px; border:1px solid var(--border); border-radius:10px;
          background:transparent; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  button, a.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 14px;
          border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text);
          font-size:14px; cursor:pointer; text-decoration:none; }
  button.primary { width:100%; margin-top:12px; background:var(--accent); border-color:var(--accent); color:#fff; font-size:16px; padding:12px; }
  button:disabled { opacity:.6; cursor:default; }
  .result { margin-top:20px; display:none; }
  .result.show { display:block; }
  .status { font-size:14px; margin-bottom:8px; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); } .status.muted { color:var(--muted); }
  .link { word-break:break-all; padding:10px 12px; border:1px dashed var(--border); border-radius:10px; font-family:ui-monospace, monospace; font-size:14px; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .err { color:var(--bad); font-size:14px; margin-top:8px; min-height:1em; }
  .hint { margin-top:16px; color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<main class="card">
  <h1>Телеграм за номером телефону</h1>
  <p class="sub">Введіть номер — отримаєте посилання на акаунт.</p>

  <form id="form" autocomplete="off">
    <label for="phone">Номер телефону</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="+380 67 123 45 67" required>
    <div class="err" id="err"></div>
    <button class="primary" id="go" type="submit">Сформувати посилання</button>
  </form>

  <section class="result" id="result">
    <div class="status" id="status"></div>
    <div class="link" id="link"></div>
    <div class="row">
      <a class="btn" id="open" target="_blank" rel="noopener">Відкрити</a>
      <button type="button" id="copy">Копіювати</button>
    </div>
  </section>

  <p class="hint" id="hint"></p>
</main>

<script>
  // Бекенд перевірки (server.py). Якщо сторінку віддає сам server.py — він знаходиться автоматично.
  // Інакше можна вказати адресу в URL: index.html?api=http://localhost:8080
  // Якщо бекенду немає — працює лише генерація посилання без перевірки.
  let API = null;

  const DEFAULT_CC = '380'; // код країни за замовчуванням (Україна)

  function normalize(raw) {
    let s = raw.trim().replace(/[\s()\-.]/g, '');
    if (s.startsWith('00')) s = '+' + s.slice(2);
    let d = s.replace(/\D/g, '');
    if (!s.startsWith('+')) {
      if (d.startsWith('0') && d.length === 10) d = DEFAULT_CC.slice(0, 2) + d;   // 0671234567 -> 380671234567
      else if (d.length === 9) d = DEFAULT_CC + d;                                 // 671234567  -> 380671234567
    }
    if (d.length < 8 || d.length > 15) return null;
    return d;
  }

  const $ = id => document.getElementById(id);
  function setHint() {
    $('hint').textContent = API === null
      ? 'Режим без перевірки: посилання t.me/+номер відкриє акаунт, якщо він існує і власник дозволив пошук за номером.'
      : 'Перевірка через Telegram API увімкнена.';
  }
  setHint();

  (async () => {
    const param = new URLSearchParams(location.search).get('api');
    const candidate = param !== null ? param.replace(/\/$/, '')
                    : location.protocol.startsWith('http') ? '' : null;
    if (candidate === null) return;
    try {
      const r = await fetch(`${candidate}/api/health`);
      if (r.ok) { API = candidate; setHint(); }
    } catch { /* бекенду немає — лишаємось у режимі без перевірки */ }
  })();

  function show(statusText, cls, url) {
    $('status').textContent = statusText;
    $('status').className = 'status ' + cls;
    $('link').textContent = url || '—';
    $('open').style.display = url ? '' : 'none';
    $('copy').style.display = url ? '' : 'none';
    if (url) $('open').href = url;
    $('result').classList.add('show');
  }

  $('form').addEventListener('submit', async e => {
    e.preventDefault();
    $('err').textContent = '';
    $('result').classList.remove('show');
    const phone = normalize($('phone').value);
    if (!phone) { $('err').textContent = 'Некоректний номер. Приклад: +380671234567'; return; }

    const fallback = 'https://t.me/+' + phone;
    if (API === null) { show('Посилання сформовано (без перевірки існування)', 'muted', fallback); return; }

    $('go').disabled = true; $('go').textContent = 'Перевіряю…';
    try {
      const r = await fetch(`${API}/api/check?phone=${phone}`);
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      if (data.exists) {
        const who = [data.name, data.username && '@' + data.username].filter(Boolean).join(' · ');
        show('Акаунт знайдено' + (who ? ': ' + who : ''), 'ok', data.link);
      } else {
        show('Акаунт не знайдено (немає в Telegram або прихований налаштуваннями приватності)', 'bad', null);
      }
    } catch (err) {
      $('err').textContent = 'Помилка перевірки: ' + err.message;
      show('Перевірка не вдалась — ось посилання без перевірки', 'muted', fallback);
    } finally {
      $('go').disabled = false; $('go').textContent = 'Сформувати посилання';
    }
  });

  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('link').textContent); $('copy').textContent = 'Скопійовано ✓'; }
    catch { $('copy').textContent = 'Не вдалось'; }
    setTimeout(() => $('copy').textContent = 'Копіювати', 1500);
  });
</script>
</body>
</html>
