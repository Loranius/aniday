name: Probih — checks & Android APK

on:
  push:
    paths: ['probih/**', '.github/workflows/probih-android.yml']
  pull_request:
    paths: ['probih/**', '.github/workflows/probih-android.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: probih

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: probih/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database migrations + RLS tests (local PostgreSQL)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql >/dev/null
          npm run test:db

  apk:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: probih/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Public anon key + URL only (protected by RLS). Set them as repository secrets.
      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: probih/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: probih-debug-apk
          path: probih/android/app/build/outputs/apk/debug/app-debug.apk
